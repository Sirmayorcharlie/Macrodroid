<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorized Access Only</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        .btn {
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover {
            background-color: #d32f2f;
        }
        p {
            color: #b0bec5;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Notice</h2>
        <p>This system controls live automated routines. Unauthorized execution of these commands may disrupt active operations.</p>
        <p><strong>By proceeding, you acknowledge you have authorization to use these tools.</strong></p>
        
        <button class="btn" onclick="proceedToDashboard()">I Am Authorized</button>
    </div>

    <script>
        function proceedToDashboard() {
            // Redirects to the dashboard within the same folder
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
