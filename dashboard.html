<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroDroid Controls</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007bff; /* Blue for general actions */
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-success {
            background-color: #28a745; /* Green for Enable/Found */
        }
        .btn-danger {
            background-color: #dc3545; /* Red for Disable/Alert */
        }
        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffc107;
        }
    </style>
</head>
<body>

    <h1>MacroDroid Actions</h1>

    <button class="btn btn-success" onclick="runMacro('https://trigger.macrodroid.com/95dfc6d5-a2fb-4bdb-89d2-957d4881ff3b/EnableBluetooth')">
        Enable Bluetooth
    </button>

    <button class="btn btn-danger" onclick="runMacro('https://trigger.macrodroid.com/95dfc6d5-a2fb-4bdb-89d2-957d4881ff3b/DisableBluetooth')">
        Disable Bluetooth
    </button>

    <hr style="width:50%; border-color: #333; margin: 25px auto;">

    <button class="btn btn-danger" onclick="runMacro('https://trigger.macrodroid.com/95dfc6d5-a2fb-4bdb-89d2-957d4881ff3b/findmyphone')">
        Find My Phone
    </button>

    <button class="btn btn-success" onclick="runMacro('https://trigger.macrodroid.com/95dfc6d5-a2fb-4bdb-89d2-957d4881ff3b/foundphone')">
        Found Phone
    </button>

    <div id="status">Status: Ready</div>

    <iframe id="secret-frame" name="secret-frame" style="display:none;"></iframe>

    <script>
        function runMacro(url) {
            const statusDiv = document.getElementById('status');
            const frame = document.getElementById('secret-frame');
            
            statusDiv.innerText = "Status: Command Transmitted";
            statusDiv.style.color = "#28a745";

            // Forces the browser to load the link invisibly
            frame.src = url;

            // Reset status text after 3 seconds
            setTimeout(() => {
                statusDiv.innerText = "Status: Ready";
                statusDiv.style.color = "#ffc107";
            }, 3000);
        }
    </script>

</body>
</html>
