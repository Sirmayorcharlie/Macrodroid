<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroDroid Controls</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 15px auto;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active {
            background-color: #0056b3;
        }
        /* Custom color for specific actions if desired */
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:active {
            background-color: #bd2130;
        }
        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>MacroDroid Actions</h1>

    <button class="btn btn-danger" onclick="runMacro('https://trigger.macrodroid.com/95dfc6d5-a2fb-4bdb-89d2-957d4881ff3b/DisableBluetooth')">
        Disable Bluetooth
    </button>

    <button class="btn" onclick="runMacro('YOUR_SECOND_WEBHOOK_URL_HERE')">
        Action Two
    </button>

    <div id="status">Status: Ready</div>

    <script>
        function runMacro(url) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Status: Sending command...";
            statusDiv.style.color = "#ffc107";

            fetch(url, { mode: 'no-cors' })
                .then(() => {
                    statusDiv.innerText = "Status: Command sent successfully.";
                    statusDiv.style.color = "#28a745";
                })
                .catch(error => {
                    statusDiv.innerText = "Status: Network error.";
                    statusDiv.style.color = #dc3545;
                    console.error('Error:', error);
                });
        }
    </script>

</body>
</html>
